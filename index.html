<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Type: Newsreader (editorial serif) + JetBrains Mono (data).
     No sans anywhere — the serif carries prose, the mono carries
     every number, label and state.
     ============================================================ */
  :root{
    color-scheme: light;

    /* neutrals, biased cool-green like a bare soldermask panel */
    --ground:#eceeea;
    --ground-2:#e3e6e0;
    --surface:#fbfcfa;
    --rule:#d5d9d1;
    --rule-strong:#bcc2b6;
    --ink:#161a15;
    --ink-soft:#4e544a;
    --ink-faint:#828a7e;
    --dot:rgba(22,26,21,.10);

    /* accent: hot solder copper */
    --accent:#a94a1c;
    --accent-lift:rgba(169,74,28,.09);
    /* secondary: probe cyan, used only for measurement + focus */
    --probe:#0f6d78;

    /* semantic state */
    --run:#25627f;  --run-bg:rgba(37,98,127,.11);
    --test:#7d5c06; --test-bg:rgba(125,92,6,.13);
    --block:#a32a20; --block-bg:rgba(163,42,32,.11);
    --done:#356140;  --done-bg:rgba(53,97,64,.12);

    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;

    --shadow:0 1px 0 rgba(22,26,21,.03), 0 6px 20px -12px rgba(22,26,21,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --ground:#101310; --ground-2:#0b0e0b; --surface:#181c17;
      --rule:#282e26; --rule-strong:#3b4338;
      --ink:#e9ece5; --ink-soft:#a6ad9f; --ink-faint:#767e71;
      --dot:rgba(233,236,229,.07);
      --accent:#e5843c; --accent-lift:rgba(229,132,60,.11);
      --probe:#5fc2cc;
      --run:#78b4d4;  --run-bg:rgba(120,180,212,.13);
      --test:#dcb352; --test-bg:rgba(220,179,82,.13);
      --block:#e5786a; --block-bg:rgba(229,120,106,.13);
      --done:#7fbf8c; --done-bg:rgba(127,191,140,.13);
      --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --ground:#eceeea; --ground-2:#e3e6e0; --surface:#fbfcfa;
    --rule:#d5d9d1; --rule-strong:#bcc2b6;
    --ink:#161a15; --ink-soft:#4e544a; --ink-faint:#828a7e;
    --dot:rgba(22,26,21,.10);
    --accent:#a94a1c; --accent-lift:rgba(169,74,28,.09); --probe:#0f6d78;
    --run:#25627f;  --run-bg:rgba(37,98,127,.11);
    --test:#7d5c06; --test-bg:rgba(125,92,6,.13);
    --block:#a32a20; --block-bg:rgba(163,42,32,.11);
    --done:#356140; --done-bg:rgba(53,97,64,.12);
    --shadow:0 1px 0 rgba(22,26,21,.03), 0 6px 20px -12px rgba(22,26,21,.28);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#101310; --ground-2:#0b0e0b; --surface:#181c17;
    --rule:#282e26; --rule-strong:#3b4338;
    --ink:#e9ece5; --ink-soft:#a6ad9f; --ink-faint:#767e71;
    --dot:rgba(233,236,229,.07);
    --accent:#e5843c; --accent-lift:rgba(229,132,60,.11); --probe:#5fc2cc;
    --run:#78b4d4;  --run-bg:rgba(120,180,212,.13);
    --test:#dcb352; --test-bg:rgba(220,179,82,.13);
    --block:#e5786a; --block-bg:rgba(229,120,106,.13);
    --done:#7fbf8c; --done-bg:rgba(127,191,140,.13);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    color:var(--ink);
    font-family:var(--serif);
    font-size:17px; line-height:1.55;
    font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 22px 22px,
      linear-gradient(var(--ground), var(--ground-2));
    background-attachment:fixed;
    min-height:100vh;
  }
  ::selection{background:var(--accent); color:var(--surface);}

  .wrap{max-width:940px; margin:0 auto; padding:44px 22px 96px;}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
    padding-bottom:18px;
    border-bottom:1px solid var(--ink);
    position:relative;
  }
  .masthead::after{ /* double rule, the thin one offset — a printed-ledger cue */
    content:""; position:absolute; left:0; right:0; bottom:-4px;
    border-bottom:1px solid var(--rule-strong);
  }
  .kicker{
    font-family:var(--mono); font-size:10.5px; font-weight:500;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px;
    display:flex; align-items:center; gap:9px;
  }
  .kicker::before{
    content:""; width:22px; height:1px; background:var(--accent); flex:none;
  }
  h1{
    font-family:var(--serif); font-weight:500;
    font-size:clamp(34px, 6vw, 52px); line-height:.98;
    letter-spacing:-.025em; margin:0;
    text-wrap:balance;
  }
  h1 em{
    font-style:italic; font-weight:400; color:var(--accent);
  }
  .mast-right{
    display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11.5px;
    color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  .stamp{display:grid; gap:2px; text-align:right; letter-spacing:.06em;}
  .stamp .lbl{font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; opacity:.75;}

  .theme-btn{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; padding:7px 10px;
    background:transparent; color:var(--ink-faint);
    border:1px solid var(--rule-strong); border-radius:0;
    cursor:pointer; white-space:nowrap;
    transition:color .15s, border-color .15s;
  }
  .theme-btn:hover{color:var(--accent); border-color:var(--accent);}

  /* ---------- summary strip ---------- */
  .summary{
    display:grid; grid-template-columns:repeat(4,1fr);
    margin-top:26px;
    border:1px solid var(--rule);
    background:var(--surface);
    box-shadow:var(--shadow);
  }
  .cell{
    padding:16px 16px 18px; border-right:1px solid var(--rule);
    display:grid; gap:6px; position:relative; overflow:hidden;
  }
  .cell:last-child{border-right:0;}
  .cell::before{ /* state hairline along the top edge */
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:currentColor; opacity:.85;
    transform:scaleX(var(--load,1)); transform-origin:left;
  }
  .cell[data-k="blocked"]{color:var(--block);}
  .cell[data-k="progress"]{color:var(--run);}
  .cell[data-k="testing"]{color:var(--test);}
  .cell[data-k="done"]{color:var(--done);}
  .cell .n{
    font-family:var(--mono); font-weight:500;
    font-size:34px; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.04em;
  }
  .cell .l{
    font-family:var(--mono); font-size:9.5px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint);
  }
  .cell.is-zero .n{color:var(--ink-faint); opacity:.45;}
  @media (max-width:620px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .cell:nth-child(2){border-right:0;}
    .cell:nth-child(-n+2){border-bottom:1px solid var(--rule);}
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:24px 0 18px;
  }
  .btn{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase;
    cursor:pointer; padding:10px 16px;
    background:var(--surface); color:var(--ink-soft);
    border:1px solid var(--rule-strong); border-radius:0;
    transition:color .15s, border-color .15s, background .15s, transform .12s;
  }
  .btn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-lift);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--probe); outline-offset:2px;}
  .btn-primary{
    background:var(--accent); border-color:var(--accent); color:var(--surface);
  }
  .btn-primary:hover{background:var(--accent); color:var(--surface); filter:brightness(1.1);}
  .flash{
    font-family:var(--mono); font-size:10.5px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--done);
    opacity:0; transform:translateX(-4px);
    transition:opacity .25s, transform .25s;
  }
  .flash.on{opacity:1; transform:none;}

  /* ---------- report ---------- */
  #reportBox{
    display:none; background:var(--surface);
    border:1px solid var(--rule); border-left:2px solid var(--accent);
    box-shadow:var(--shadow);
    padding:20px 22px; margin:0 0 26px;
    font-family:var(--mono); font-size:12px; line-height:1.85;
    white-space:pre-wrap; overflow-x:auto; color:var(--ink-soft);
  }
  #reportBox.show{display:block; animation:riseIn .3s ease both;}

  /* ---------- section label ---------- */
  .log-label{
    display:flex; align-items:center; gap:12px;
    font-family:var(--mono); font-size:9.5px; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:10px;
  }
  .log-label::after{content:""; flex:1; height:1px; background:var(--rule);}

  /* ---------- log rows ---------- */
  .log{border-top:1px solid var(--ink);}
  .row{
    background:var(--surface);
    border-bottom:1px solid var(--rule);
    padding:20px 22px 20px 24px;
    display:grid; gap:13px;
    position:relative;
    transition:background .18s;
    animation:riseIn .42s cubic-bezier(.22,.9,.3,1) both;
    animation-delay:calc(var(--i) * 45ms);
  }
  .row::before{ /* state edge, drawn on hover */
    content:""; position:absolute; left:0; top:-1px; bottom:-1px; width:2px;
    background:currentColor; transform:scaleY(0); transform-origin:top;
    transition:transform .22s ease;
  }
  .row:hover::before{transform:scaleY(1);}
  .row:hover{background:var(--accent-lift);}
  .row[data-s="blocked"]{color:var(--block);}
  .row[data-s="progress"]{color:var(--run);}
  .row[data-s="testing"]{color:var(--test);}
  .row[data-s="done"]{color:var(--done);}

  .row-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
  }
  .name{
    font-family:var(--serif); font-size:23px; font-weight:500;
    letter-spacing:-.02em; line-height:1.15; color:var(--ink);
  }
  .row[data-s="done"] .name{color:var(--ink-soft);}
  .cat{
    font-family:var(--mono); font-size:9.5px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    border:1px solid var(--rule-strong);
    padding:2px 7px; margin-left:11px; vertical-align:4px; white-space:nowrap;
  }
  .state{
    font-family:var(--mono); font-size:10px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase;
    padding:5px 10px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px;
  }
  .state .led{
    width:5px; height:5px; border-radius:50%; background:currentColor; flex:none;
  }
  .state-progress{background:var(--run-bg); color:var(--run);}
  .state-testing{background:var(--test-bg); color:var(--test);}
  .state-blocked{background:var(--block-bg); color:var(--block);}
  .state-done{background:var(--done-bg); color:var(--done);}
  .state-blocked .led{animation:blink 1.6s ease-in-out infinite;}
  .state-testing .led{animation:blink 2.6s ease-in-out infinite;}

  .facts{display:grid; gap:6px; font-size:16.5px; color:var(--ink-soft); max-width:66ch;}
  .facts .k{
    font-family:var(--mono); font-size:9.5px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
    margin-right:10px;
  }
  .facts .blocked-line{color:var(--block);}
  .facts .quiet{font-style:italic; opacity:.7;}

  .meter{
    display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11.5px; font-weight:500;
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
    color:var(--ink-faint);
  }
  .track{
    position:relative; flex:1; height:10px;
    background:var(--ground); border:1px solid var(--rule); overflow:hidden;
  }
  .track::after{ /* quarter graduations */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(to right,
      transparent 0 calc(25% - 1px), var(--rule-strong) calc(25% - 1px), var(--rule-strong) 25%);
    opacity:.8;
  }
  .fill{
    height:100%; width:0; background:currentColor;
    transition:width .8s cubic-bezier(.2,.8,.25,1);
    transition-delay:calc(var(--i) * 45ms + 120ms);
  }
  .pct{min-width:4.5ch; text-align:right; color:var(--ink-soft);}

  .row-actions{display:flex; gap:8px;}
  .row-actions .btn{padding:6px 12px; font-size:10px; letter-spacing:.12em;}

  .empty{
    background:var(--surface); border-bottom:1px solid var(--rule);
    padding:60px 24px; text-align:center; color:var(--ink-faint);
    font-size:19px; font-style:italic;
  }
  .empty span{
    display:block; font-family:var(--mono); font-style:normal;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    margin-top:12px; opacity:.7;
  }

  /* ---------- dialog ---------- */
  dialog{
    border:1px solid var(--rule-strong); border-top:2px solid var(--accent);
    border-radius:0; background:var(--surface); color:var(--ink);
    padding:0; width:470px; max-width:calc(100vw - 28px);
    box-shadow:0 24px 60px -24px rgba(0,0,0,.5);
  }
  dialog[open]{animation:riseIn .26s cubic-bezier(.22,.9,.3,1) both;}
  dialog::backdrop{background:rgba(8,11,8,.62); backdrop-filter:blur(2px);}
  .dlg-body{padding:24px 26px 26px; display:grid; gap:16px;}
  .dlg-title{
    font-family:var(--mono); font-size:10.5px; font-weight:500;
    letter-spacing:.22em; text-transform:uppercase; color:var(--accent);
    margin:0; display:flex; align-items:center; gap:9px;
  }
  .dlg-title::after{content:""; flex:1; height:1px; background:var(--rule);}
  .field{display:grid; gap:6px;}
  .field label{
    font-family:var(--mono); font-size:9.5px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);
  }
  input,select,textarea{
    font-family:var(--serif); font-size:16px; width:100%;
    background:var(--ground); color:var(--ink);
    border:1px solid var(--rule-strong); border-radius:0; padding:9px 10px;
    transition:border-color .15s, box-shadow .15s;
  }
  #f-pct{font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums;}
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--probe);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--probe) 22%, transparent);
  }
  textarea{resize:vertical; min-height:62px; line-height:1.5;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .dlg-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .err{
    color:var(--block); font-size:15px; font-style:italic; margin:0;
    min-height:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001s !important; animation-duration:.001s !important; animation-iteration-count:1 !important;}
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:none;}
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:.28;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="kicker">Hardware &amp; firmware bench log</p>
      <h1>Project <em>tracker</em></h1>
    </div>
    <div class="mast-right">
      <div class="stamp">
        <span class="lbl">Today</span>
        <span id="stamp"></span>
      </div>
      <button type="button" class="theme-btn" id="btnTheme" aria-label="Change colour theme">Auto</button>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <div class="toolbar">
    <button type="button" class="btn btn-primary" id="btnAdd">Add project</button>
    <button type="button" class="btn" id="btnReport">Daily update</button>
    <button type="button" class="btn" id="btnExport">Export JSON</button>
    <span class="flash" id="flash"></span>
  </div>

  <pre id="reportBox"></pre>

  <p class="log-label" id="logLabel">Active log</p>
  <div class="log" id="log"></div>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg-body" id="form">
    <p class="dlg-title" id="dlgTitle">Add project</p>
    <div class="field">
      <label for="f-name">Project name</label>
      <input id="f-name" placeholder="OVP circuit rev2 PCB" autocomplete="off">
    </div>
    <div class="two">
      <div class="field">
        <label for="f-cat">Category</label>
        <select id="f-cat">
          <option value="pcb">PCB design</option>
          <option value="fw">Firmware</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status">
          <option value="progress">In progress</option>
          <option value="testing">Testing</option>
          <option value="blocked">Blocked</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-pct">Percent complete</label>
      <input id="f-pct" type="number" min="0" max="100" step="5" value="0">
    </div>
    <div class="field">
      <label for="f-next">Next action</label>
      <textarea id="f-next" placeholder="What you'll do next on this"></textarea>
    </div>
    <div class="field">
      <label for="f-blocker">Blocker (optional)</label>
      <textarea id="f-blocker" placeholder="Leave blank if nothing is blocking it"></textarea>
    </div>
    <p class="err" id="err"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="btnSave">Save</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  var KEY = "project-tracker.v1";
  var THEME_KEY = "project-tracker.theme";
  var LEGACY = "projects";
  var projects = [];
  var editId = "";

  var CATS = {pcb:"PCB", fw:"Firmware", other:"Other"};
  var STATES = {progress:"In progress", testing:"Testing", blocked:"Blocked", done:"Done"};
  var ORDER = ["blocked","progress","testing","done"];
  var RANK = {blocked:0, progress:1, testing:2, done:3};

  var $ = function(id){ return document.getElementById(id); };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function today(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  /* ---------- theme ---------- */
  var THEMES = ["auto","light","dark"];
  function applyTheme(t){
    if(t === "auto"){ document.documentElement.removeAttribute("data-theme"); }
    else{ document.documentElement.setAttribute("data-theme", t); }
    $("btnTheme").textContent = t;
  }
  function initTheme(){
    var t = "auto";
    try{ t = localStorage.getItem(THEME_KEY) || "auto"; }catch(e){}
    if(THEMES.indexOf(t) === -1) t = "auto";
    applyTheme(t);
  }
  function cycleTheme(){
    var cur = document.documentElement.getAttribute("data-theme") || "auto";
    var next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  }

  /* ---------- storage ---------- */
  function load(){
    var raw = null;
    try{ raw = localStorage.getItem(KEY) || localStorage.getItem(LEGACY); }
    catch(e){ raw = null; }
    if(!raw){ projects = []; return; }
    try{
      var parsed = JSON.parse(raw);
      projects = Array.isArray(parsed) ? parsed.filter(function(p){ return p && p.name; }) : [];
    }catch(e){ projects = []; }
  }

  function persist(){
    try{
      localStorage.setItem(KEY, JSON.stringify(projects));
    }catch(e){
      flash("Couldn't save — storage is full or blocked", true);
    }
  }

  function flash(msg, bad){
    var el = $("flash");
    el.textContent = msg;
    el.style.color = bad ? "var(--block)" : "var(--done)";
    el.classList.add("on");
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ el.classList.remove("on"); }, 3000);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- counters ---------- */
  function countUp(el, to){
    if(reduceMotion || to === 0){ el.textContent = to; return; }
    var start = performance.now(), dur = 480;
    (function step(now){
      var t = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3)));
      if(t < 1) requestAnimationFrame(step);
    })(start);
  }

  /* ---------- render ---------- */
  function render(animate){
    $("stamp").textContent = today();

    var counts = {progress:0, testing:0, blocked:0, done:0};
    projects.forEach(function(p){ if(counts[p.status] != null) counts[p.status]++; });

    $("summary").innerHTML = ORDER.map(function(k){
      return '<div class="cell' + (counts[k] === 0 ? " is-zero" : "") + '" data-k="' + k + '">' +
               '<span class="n" data-n="' + counts[k] + '">0</span>' +
               '<span class="l">' + esc(STATES[k]) + '</span>' +
             '</div>';
    }).join("");
    Array.prototype.forEach.call($("summary").querySelectorAll(".n"), function(el){
      countUp(el, Number(el.getAttribute("data-n")));
    });

    var log = $("log");
    $("logLabel").textContent = projects.length
      ? "Active log — " + projects.length + (projects.length === 1 ? " project" : " projects")
      : "Active log";

    if(projects.length === 0){
      log.innerHTML = '<div class="empty">Nothing on the bench yet.<span>Add a project to start the log</span></div>';
      return;
    }

    var sorted = projects.slice().sort(function(a,b){
      return (RANK[a.status] - RANK[b.status]) || a.name.localeCompare(b.name);
    });

    log.innerHTML = sorted.map(function(p, i){
      var pct = Math.max(0, Math.min(100, Number(p.pct) || 0));
      var delay = animate ? i : 0;
      return '' +
      '<article class="row" data-s="' + esc(p.status) + '" style="--i:' + delay + '">' +
        '<div class="row-head">' +
          '<div><span class="name">' + esc(p.name) + '</span>' +
            '<span class="cat">' + esc(CATS[p.cat] || "Other") + '</span></div>' +
          '<span class="state state-' + esc(p.status) + '"><span class="led"></span>' +
            esc(STATES[p.status] || p.status) + '</span>' +
        '</div>' +
        '<div class="facts">' +
          '<div><span class="k">Next</span>' +
            (p.next ? esc(p.next) : '<span class="quiet">not set</span>') + '</div>' +
          (p.blocker ? '<div class="blocked-line"><span class="k">Blocked by</span>' + esc(p.blocker) + '</div>' : "") +
          '<div><span class="k">Updated</span>' + esc(p.updated || "—") + '</div>' +
        '</div>' +
        '<div class="meter">' +
          '<div class="track"><div class="fill" data-w="' + pct + '" style="--i:' + delay + '"></div></div>' +
          '<span class="pct">' + pct + '%</span>' +
        '</div>' +
        '<div class="row-actions">' +
          '<button type="button" class="btn" data-act="edit" data-id="' + esc(p.id) + '">Edit</button>' +
          '<button type="button" class="btn" data-act="del" data-id="' + esc(p.id) + '">Delete</button>' +
        '</div>' +
      '</article>';
    }).join("");

    // let the browser paint width:0 first so the meters animate outward
    requestAnimationFrame(function(){
      Array.prototype.forEach.call(log.querySelectorAll(".fill"), function(el){
        el.style.width = el.getAttribute("data-w") + "%";
      });
    });
  }

  /* ---------- dialog ---------- */
  function openDialog(id){
    editId = id || "";
    $("err").textContent = "";
    $("dlgTitle").textContent = id ? "Edit project" : "Add project";
    var p = id ? projects.filter(function(x){ return x.id === id; })[0] : null;
    $("f-name").value    = p ? p.name : "";
    $("f-cat").value     = p ? (p.cat || "other") : "pcb";
    $("f-status").value  = p ? p.status : "progress";
    $("f-pct").value     = p ? (Number(p.pct) || 0) : 0;
    $("f-next").value    = p ? (p.next || "") : "";
    $("f-blocker").value = p ? (p.blocker || "") : "";
    $("dlg").showModal();
    $("f-name").focus();
  }

  function save(){
    var name = $("f-name").value.trim();
    if(!name){
      $("err").textContent = "Give the project a name so it can be identified in the report.";
      $("f-name").focus();
      return;
    }
    var data = {
      name: name,
      cat: $("f-cat").value,
      status: $("f-status").value,
      pct: Math.max(0, Math.min(100, Number($("f-pct").value) || 0)),
      next: $("f-next").value.trim(),
      blocker: $("f-blocker").value.trim(),
      updated: today()
    };
    if(editId){
      projects = projects.map(function(p){ return p.id === editId ? Object.assign({}, p, data) : p; });
    }else{
      data.id = "p" + Date.now() + Math.random().toString(36).slice(2,6);
      projects.push(data);
    }
    var wasEdit = !!editId;
    persist();
    render(false);
    $("dlg").close();
    flash(wasEdit ? "Updated" : "Added");
  }

  /* ---------- report ---------- */
  function report(){
    var box = $("reportBox");
    box.classList.add("show");
    if(projects.length === 0){
      box.textContent = "No projects tracked yet.";
      return;
    }
    var g = {progress:[], testing:[], blocked:[], done:[]};
    projects.forEach(function(p){ if(g[p.status]) g[p.status].push(p); });

    var out = "Daily update — " + today() + "\n\n";
    if(g.progress.length){
      out += "In progress:\n";
      g.progress.forEach(function(p){ out += "- " + p.name + " (" + (Number(p.pct)||0) + "%) — " + (p.next || "next step tbd") + "\n"; });
      out += "\n";
    }
    if(g.testing.length){
      out += "In testing:\n";
      g.testing.forEach(function(p){ out += "- " + p.name + " — " + (p.next || "validating results") + "\n"; });
      out += "\n";
    }
    if(g.blocked.length){
      out += "Blocked — need input:\n";
      g.blocked.forEach(function(p){ out += "- " + p.name + " — " + (p.blocker || "blocker not specified") + "\n"; });
      out += "\n";
    }
    if(g.done.length){
      out += "Completed:\n";
      g.done.forEach(function(p){ out += "- " + p.name + "\n"; });
    }
    out = out.trim();
    box.textContent = out;

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out).then(function(){
        flash("Copied to clipboard");
      }, function(){
        flash("Report ready — select and copy it");
      });
    }else{
      flash("Report ready — select and copy it");
    }
  }

  function exportJson(){
    var blob = new Blob([JSON.stringify(projects, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "project-tracker-" + today() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    flash("Exported");
  }

  /* ---------- wiring ---------- */
  $("btnTheme").addEventListener("click", cycleTheme);
  $("btnAdd").addEventListener("click", function(){ openDialog(); });
  $("btnReport").addEventListener("click", report);
  $("btnExport").addEventListener("click", exportJson);
  $("btnSave").addEventListener("click", save);
  $("btnCancel").addEventListener("click", function(){ $("dlg").close(); });

  $("form").addEventListener("submit", function(e){ e.preventDefault(); });
  $("f-name").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); save(); }
  });

  $("log").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-act]");
    if(!btn) return;
    var id = btn.getAttribute("data-id");
    if(btn.getAttribute("data-act") === "edit"){
      openDialog(id);
    }else{
      var p = projects.filter(function(x){ return x.id === id; })[0];
      if(p && window.confirm('Delete "' + p.name + '"? This cannot be undone.')){
        projects = projects.filter(function(x){ return x.id !== id; });
        persist();
        render(false);
        flash("Deleted");
      }
    }
  });

  // keep multiple tabs of the tracker in sync
  window.addEventListener("storage", function(e){
    if(e.key === KEY){ load(); render(false); }
    if(e.key === THEME_KEY){ initTheme(); }
  });

  initTheme();
  load();
  render(true);
})();
</script>

</body>
</html>
